name: Update contribution snake

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/contribution-snake.yml'
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out profile repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Generate dark and light SVGs
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/contribution-snake-dark.svg?palette=github-dark&color_snake=%2390d8c8&color_dots=%2313212c,%231c3d4b,%23295a6a,%233f818a,%235bb5ab
            dist/contribution-snake-light.svg?palette=github-light&color_snake=%230b6e68&color_dots=%23e6f1f2,%23bedbdd,%238cbfc3,%23598e9b,%232d6477

      - name: Publish SVGs to snake-output
        shell: bash
        run: |
          branch=snake-output
          publish_dir="$RUNNER_TEMP/contribution-snake"
          if git ls-remote --exit-code --heads origin "refs/heads/$branch"; then
            git fetch --no-tags origin "refs/heads/$branch"
            git worktree add --detach "$publish_dir" FETCH_HEAD
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            git worktree add --detach "$publish_dir" HEAD
            git -C "$publish_dir" switch --orphan "$branch"
          fi

          for image in contribution-snake-dark.svg contribution-snake-light.svg; do
            test -s "dist/$image"
            cp "dist/$image" "$publish_dir/$image"
          done
          git -C "$publish_dir" add contribution-snake-dark.svg contribution-snake-light.svg
          if git -C "$publish_dir" diff --cached --quiet; then
            exit 0
          fi

          git -C "$publish_dir" -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'Update contribution snake SVGs'
          git -C "$publish_dir" push origin "HEAD:refs/heads/$branch"
